name: Kol HaLashon - upload + refine (Yosef's own repo)

# רק שני ה-jobs שהיו תקועים: העלאת ה-mp4 שכבר מרונדרים בדרייב, ודחיפת
# כותרת+תיאור מ-_תמלולים/<id>.json לסרטונים שכבר ביוטיוב.
# הקוד זהה מילה-במילה ל-7614415/video-dl-pub (שם הסודות פגו ואין גישה לעדכנם).

on:
  workflow_dispatch:
    inputs:
      ready_upload_limit:
        description: "Max videos to upload this run"
        required: false
        default: "15"
  schedule:
    - cron: "0 3 * * *"    # 06:00 Israel
    - cron: "0 9 * * *"    # 12:00 Israel - אחרי איפוס מכסת ההעלאות של יוטיוב

jobs:
  upload_ready_videos:

    runs-on: ubuntu-latest
    steps:
      - name: download finished mp4s from Drive and upload to YouTube
        env:
          DCID: ${{ secrets.DRIVE_CLIENT_ID }}
          DCSEC: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRTOK: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          YCID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YCSEC: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YRTOK: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          LIMIT: ${{ github.event.inputs.ready_upload_limit || '15' }}
        run: |
          python3 - <<'PY'
          import os, json, re, urllib.request, urllib.error, urllib.parse

          DCID, DCSEC, DRTOK = os.environ["DCID"], os.environ["DCSEC"], os.environ["DRTOK"]
          YCID, YCSEC, YRTOK = os.environ["YCID"], os.environ["YCSEC"], os.environ["YRTOK"]
          LIMIT = int(os.environ.get("LIMIT") or 1)
          RAV_ID = 995449
          ROOT_FOLDER_NAME = "הרב אבשלום שניידר - קול הלשון"
          READY_FOLDER_NAME = "מוכן להעלאה ליוטיוב"
          MANIFEST_NAME = "_youtube_uploaded.json"

          def get_token(cid, csec, rtok):
              body = urllib.parse.urlencode({
                  "client_id": cid, "client_secret": csec,
                  "refresh_token": rtok, "grant_type": "refresh_token"}).encode()
              return json.load(urllib.request.urlopen("https://oauth2.googleapis.com/token", body, timeout=60))["access_token"]

          DT = get_token(DCID, DCSEC, DRTOK)
          YT = get_token(YCID, YCSEC, YRTOK)

          def drive_get(url):
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + DT})
              return json.load(urllib.request.urlopen(req, timeout=60))

          def yt_get(url):
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + YT})
              return json.load(urllib.request.urlopen(req, timeout=60))

          def yt_post(url, obj):
              body = json.dumps(obj).encode()
              req = urllib.request.Request(url, data=body, headers={
                  "Authorization": "Bearer " + YT, "Content-Type": "application/json; charset=UTF-8"})
              return json.load(urllib.request.urlopen(req, timeout=60))

          def list_children(fid):
              out, pt = [], None
              while True:
                  u = ("https://www.googleapis.com/drive/v3/files?q="
                       + urllib.parse.quote("'%s' in parents and trashed=false" % fid)
                       + "&fields=files(id,name,mimeType),nextPageToken&pageSize=1000")
                  if pt:
                      u += "&pageToken=" + pt
                  r = drive_get(u)
                  out += r.get("files", [])
                  pt = r.get("nextPageToken")
                  if not pt:
                      return out

          q = "name='%s' and mimeType='application/vnd.google-apps.folder' and trashed=false" % ROOT_FOLDER_NAME
          r = drive_get("https://www.googleapis.com/drive/v3/files?q=" + urllib.parse.quote(q) + "&fields=files(id,name)")
          if not r.get("files"):
              print("no drive folder yet")
              raise SystemExit(0)
          root_id = r["files"][0]["id"]
          root_children = list_children(root_id)
          ready_folder = next((f for f in root_children if f["name"] == READY_FOLDER_NAME), None)
          if not ready_folder:
              print("no ready-for-upload folder yet (local render_local.py hasn't produced any videos)")
              raise SystemExit(0)
          ready_id = ready_folder["id"]
          ready_children = [f for f in list_children(ready_id) if f["name"].lower().endswith(".mp4")]

          manifest = {}
          manifest_file_id = None
          existing = next((f for f in root_children if f["name"] == MANIFEST_NAME), None)
          if existing:
              manifest_file_id = existing["id"]
              req = urllib.request.Request(
                  "https://www.googleapis.com/drive/v3/files/%s?alt=media" % manifest_file_id,
                  headers={"Authorization": "Bearer " + DT})
              manifest = json.load(urllib.request.urlopen(req, timeout=60))
          print("already uploaded to youtube:", len(manifest))

          def save_manifest():
              body = json.dumps(manifest, ensure_ascii=False).encode()
              if manifest_file_id:
                  req = urllib.request.Request(
                      "https://www.googleapis.com/upload/drive/v3/files/%s?uploadType=media" % manifest_file_id,
                      data=body, method="PATCH",
                      headers={"Authorization": "Bearer " + DT, "Content-Type": "application/json; charset=UTF-8"})
                  urllib.request.urlopen(req, timeout=60)
              else:
                  meta = json.dumps({"name": MANIFEST_NAME, "parents": [root_id]}).encode()
                  boundary = "xxxxKolHalashonBoundaryxxxx"
                  multipart = (
                      ("--%s\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" % boundary).encode()
                      + meta + b"\r\n"
                      + ("--%s\r\nContent-Type: application/json\r\n\r\n" % boundary).encode()
                      + body + ("\r\n--%s--" % boundary).encode()
                  )
                  req = urllib.request.Request(
                      "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",
                      data=multipart,
                      headers={"Authorization": "Bearer " + DT,
                               "Content-Type": "multipart/related; boundary=" + boundary})
                  resp = json.load(urllib.request.urlopen(req, timeout=60))
                  globals()["manifest_file_id"] = resp["id"]

          # a video that YouTube accepted the bytes for but then rejected during processing
          # (e.g. the unverified-channel 15-minute length cap) still gets a video_id and thus
          # a manifest entry from the try/except below - so it silently looks "done" forever.
          # Recheck every previously-uploaded video's real status here and requeue any that
          # failed processing (delete the broken video, drop the manifest entry) so the main
          # loop picks it up again this run. Cheap (one videos.list call per entry).
          def check_processing(video_id):
              try:
                  r = yt_get("https://www.googleapis.com/youtube/v3/videos?part=status,processingDetails&id=%s" % video_id)
                  items = r.get("items", [])
                  if not items:
                      return "missing"
                  st = items[0]["status"]
                  proc = items[0].get("processingDetails", {})
                  if st.get("uploadStatus") == "failed" or proc.get("processingStatus") == "failed":
                      return "failed"
                  return "ok"
              except Exception as e:
                  print("  (status check error, leaving as-is):", e)
                  return "ok"

          requeued = 0
          for fid_key, info in list(manifest.items()):
              vid = info.get("video_id")
              if not vid:
                  continue
              status = check_processing(vid)
              if status in ("failed", "missing"):
                  print("  requeue (status=%s): %s (%s)" % (status, info.get("title"), vid), flush=True)
                  try:
                      del_req = urllib.request.Request(
                          "https://www.googleapis.com/youtube/v3/videos?id=%s" % vid,
                          headers={"Authorization": "Bearer " + YT}, method="DELETE")
                      urllib.request.urlopen(del_req, timeout=30)
                  except Exception as e:
                      print("    delete failed (maybe already gone):", e)
                  del manifest[fid_key]
                  requeued += 1
          if requeued:
              save_manifest()
              print("requeued %d previously-failed upload(s) for retry" % requeued, flush=True)

          def parse_name(name):
              m = re.match(r"^(\d{4}-\d{2}-\d{2}) - (.+) \[(\d+)\]\.mp4$", name)
              if not m:
                  return None, name.rsplit(".", 1)[0], None
              return m.group(1), m.group(2), int(m.group(3))

          # category per lesson, so each topic can get its own YouTube playlist ("album") -
          # same source of truth (Kol HaLashon's own API) as the prepare_frames job uses.
          # v4 (09/09/2026): CatDesc2 (fine, 30 topics) instead of CatDesc1 (coarse, 4 - one of
          # which lumps 3 different Ramchal books into one "שעורים בספרי רמח"ל" bucket) -
          # matches prepare_frames, and Yosef already approved CatDesc2 explicitly.
          # Also: for "ספר דעת תבונות לרמח"ל" lessons, Kol HaLashon's own title text already
          # names the exact אות/סימן/עמוד the lesson covers (e.g. "אות נ"ב עד נ"ה, ספר דעת
          # תבונות") - Yosef asked for that citation to survive into the description even after
          # the transcript-based title/description rewrite replaces the original title. Strip
          # the redundant ", ספר דעת תבונות" suffix (the category already says that) and store
          # the rest as dt_citation_by_id, consumed later by refine_metadata.
          import re as _re_cat
          DAAT_TEVUNOT_CAT = 'ספר דעת תבונות לרמח"ל'

          def extract_dt_citation(title):
              c = _re_cat.sub(r'\s*,?\s*ספר דעת תבונות\s*$', '', (title or '').strip())
              c = _re_cat.sub(r'\s+', ' ', c).strip()
              return c or None

          cat_by_id = {}
          dt_citation_by_id = {}
          from_row, page = 0, 100
          while True:
              body = json.dumps({
                  "QueryType": -1, "LangID": -1, "MasechetID": -1, "DafNo": -1,
                  "MasechetIDY": -1, "DafNoY": -1, "MoedID": -1, "ParashaID": -1,
                  "EnglishDisplay": False, "MasechetIDYOz": -1, "DafNoYOz": -1,
                  "FromRow": from_row, "NumOfRows": page,
                  "PrefferedLanguage": -1, "SearchOrder": 4,
                  "FiltersArray": [], "GeneralID": RAV_ID, "CustomBool": False,
                  "activefilterType": "all"
              }).encode()
              req = urllib.request.Request(
                  "https://www.kolhalashon.com/api/Search/WebSite_GetRavShiurim/",
                  data=body, headers={
                      "Content-Type": "application/json",
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36",
                      "Referer": "https://www.kolhalashon.com/he/regularSite/ravs/%d" % RAV_ID,
                      "Origin": "https://www.kolhalashon.com"})
              batch = json.load(urllib.request.urlopen(req, timeout=60))
              if not batch:
                  break
              for s in batch:
                  cat2 = (s.get("CatDesc2") or "").strip()
                  cat = cat2 or s.get("CatDesc1") or "כללי"
                  cat_by_id[s["FileId"]] = cat
                  if cat == DAAT_TEVUNOT_CAT:
                      dt_citation_by_id[s["FileId"]] = extract_dt_citation(s.get("TitleHebrew"))
              from_row += page
              if len(batch) < page:
                  break
          print("category map size:", len(cat_by_id), "daat-tevunot citations:", len(dt_citation_by_id))

          _existing_playlists = None
          def list_my_playlists():
              out, pt = [], None
              while True:
                  u = "https://www.googleapis.com/youtube/v3/playlists?part=snippet&mine=true&maxResults=50"
                  if pt:
                      u += "&pageToken=" + pt
                  r = yt_get(u)
                  out += r.get("items", [])
                  pt = r.get("nextPageToken")
                  if not pt:
                      return out

          _all_playlists = list_my_playlists()
          playlist_cache = {}
          def get_or_create_playlist(category):
              if category in playlist_cache:
                  return playlist_cache[category]
              for pl in _all_playlists:
                  if pl["snippet"]["title"] == category:
                      playlist_cache[category] = pl["id"]
                      return pl["id"]
              pl = yt_post("https://www.googleapis.com/youtube/v3/playlists?part=snippet,status", {
                  "snippet": {"title": category, "description": "הרב אבשלום שניידר - מכון להב מפיו יצא"},
                  "status": {"privacyStatus": "public"}
              })
              playlist_cache[category] = pl["id"]
              _all_playlists.append(pl)
              return pl["id"]

          def add_to_playlist(playlist_id, video_id):
              yt_post("https://www.googleapis.com/youtube/v3/playlistItems?part=snippet", {
                  "snippet": {"playlistId": playlist_id, "resourceId": {"kind": "youtube#video", "videoId": video_id}}
              })

          def download_from_drive(file_id, out_path):
              req = urllib.request.Request(
                  "https://www.googleapis.com/drive/v3/files/%s?alt=media" % file_id,
                  headers={"Authorization": "Bearer " + DT})
              with urllib.request.urlopen(req, timeout=600) as r, open(out_path, "wb") as fh:
                  while True:
                      chunk = r.read(1 << 22)
                      if not chunk:
                          break
                      fh.write(chunk)

          def upload_youtube(video_path, title, description, tok, publish_at):
              # scheduled ("private" + publishAt) rather than immediately public - Yosef wants
              # lessons to drip out one per day, never on Shabbat, instead of dumping the whole
              # backlog on the channel at once.
              meta = json.dumps({
                  "snippet": {"title": title[:100], "description": description, "categoryId": "22"},
                  "status": {"privacyStatus": "private", "publishAt": publish_at}
              }).encode()
              size = os.path.getsize(video_path)
              req = urllib.request.Request(
                  "https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status",
                  meta, {"Authorization": "Bearer " + tok,
                         "Content-Type": "application/json; charset=UTF-8",
                         "X-Upload-Content-Type": "video/mp4",
                         "X-Upload-Content-Length": str(size)})
              sess = urllib.request.urlopen(req, timeout=120).headers["Location"]
              CH = 8 << 20
              sent = 0
              video_id = None
              with open(video_path, "rb") as fh:
                  while sent < size:
                      data = fh.read(CH)
                      end = sent + len(data) - 1
                      put = urllib.request.Request(sess, data, method="PUT")
                      put.add_header("Content-Range", "bytes %d-%d/%d" % (sent, end, size))
                      try:
                          resp = urllib.request.urlopen(put, timeout=600)
                          video_id = json.load(resp)["id"]
                          sent = size
                      except urllib.error.HTTPError as e:
                          if e.code != 308:
                              print(e.read().decode("utf-8", "replace")[:500])
                              raise
                          sent = end + 1
              return video_id

          # Yosef reconsidered (08/09/2026): no more 1/day throttle - "as fast as possible,
          # no daily limit at all". Publish (almost) immediately on upload; the only real
          # pacing left is YouTube's own upload quota (~6/day), not anything we impose. The
          # one hard rule that stays is never Shabbat - if "now" lands on a Saturday, push to
          # Sunday morning. Videos processed in the same run are spread a few minutes apart
          # (not days) just so they don't all technically go live in the same instant.
          import datetime
          _next_slot = [datetime.datetime.utcnow() + datetime.timedelta(minutes=10)]

          def next_publish_slot():
              while _next_slot[0].weekday() == 5:  # Saturday = Shabbat, skip to Sunday morning
                  _next_slot[0] = datetime.datetime.combine(
                      _next_slot[0].date() + datetime.timedelta(days=1), datetime.time(4, 0))
              slot = _next_slot[0]
              _next_slot[0] = slot + datetime.timedelta(minutes=15)
              return slot.strftime("%Y-%m-%dT%H:%M:%SZ")

          todo = [f for f in ready_children if f["id"] not in manifest][:LIMIT]
          print("videos ready in drive=%d, to upload this run=%d" % (len(ready_children), len(todo)))

          def clean_title(t):
              return re.sub(r'^REC_\d+\s*', '', t or '').strip()

          ok, failed = 0, 0
          for i, f in enumerate(todo):
              date, title, fid = parse_name(f["name"])
              title = clean_title(title)
              full_title = ("%s - %s" % (date, title)) if date else title
              category = cat_by_id.get(fid, "כללי")
              dt_citation = dt_citation_by_id.get(fid)
              print("[%d/%d] (%s) %s" % (i + 1, len(todo), category, full_title), flush=True)
              try:
                  download_from_drive(f["id"], "ready.mp4")
                  description = "הרב אבשלום שניידר - מכון להב מפיו יצא\nמקור: קול הלשון\n\nהועלה אוטומטית."
                  if dt_citation:
                      description = "📖 מיקום בספר: %s\n\n%s" % (dt_citation, description)
                  publish_at = next_publish_slot()
                  vid = upload_youtube("ready.mp4", full_title, description, YT, publish_at)
                  try:
                      pl_id = get_or_create_playlist(category)
                      add_to_playlist(pl_id, vid)
                  except Exception as e:
                      print("  (playlist add failed, video still uploaded):", e, flush=True)
                  manifest[f["id"]] = {"video_id": vid, "title": full_title, "category": category, "publish_at": publish_at, "dt_citation": dt_citation}
                  save_manifest()
                  print("  -> uploaded https://youtu.be/%s (playlist: %s, publishes: %s)" % (vid, category, publish_at), flush=True)
                  ok += 1
                  os.remove("ready.mp4")
              except Exception as e:
                  # להדפיס גם את סיבת השגיאה מגוף התשובה - בלי זה "400 Bad Request" לבדו
                  # לא מבדיל בין מכסה יומית שנגמרה (uploadLimitExceeded, תקין - ימשיך מחר)
                  # לבין תקלה אמיתית שצריך לטפל בה
                  detail = ""
                  try:
                      detail = e.read().decode("utf-8", "replace")[:300] if hasattr(e, "read") else ""
                  except Exception:
                      pass
                  print("  -> FAILED:", e, detail, flush=True)
                  failed += 1

          print("youtube upload done: ok=%d failed=%d" % (ok, failed), flush=True)
          PY

  refine_metadata:
    needs: upload_ready_videos
    if: always()

    runs-on: ubuntu-latest
    steps:
      - name: pick up locally-written title+description (from real transcripts) and push them to YouTube
        env:
          DCID: ${{ secrets.DRIVE_CLIENT_ID }}
          DCSEC: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRTOK: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          YCID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YCSEC: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YRTOK: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python3 - <<'PY'
          # No Gemini here (08/09/2026 - Yosef: "Gemini עולה כסף", correctly caught that I'd
          # slipped into using it for this). The actual transcript-to-title/description writing
          # happens locally, by Claude itself (the nightly scheduled agent task, which runs
          # under Yosef's own Claude Code session - no separate paid API call at all), which
          # reads the real transcript (fetched via yt-dlp - see fetch_captions_local.py; the
          # only piece that genuinely needed a residential IP, since NetFree blocks
          # googleapis.com/youtube locally but allows www.youtube.com, and yt-dlp itself is
          # bot-blocked from GitHub Actions datacenter IPs) and writes a real title+description
          # from it, saving both as "<video_id>.json" in Drive's "_תמלולים" folder. This job's
          # only work is: check for such a file per still-unrefined video, and if present, push
          # it to YouTube via videos.update (that part works fine from Actions).
          import os, json, re, html, urllib.request, urllib.error, urllib.parse

          DCID, DCSEC, DRTOK = os.environ["DCID"], os.environ["DCSEC"], os.environ["DRTOK"]
          YCID, YCSEC, YRTOK = os.environ["YCID"], os.environ["YCSEC"], os.environ["YRTOK"]
          ROOT_FOLDER_NAME = "הרב אבשלום שניידר - קול הלשון"
          MANIFEST_NAME = "_youtube_uploaded.json"
          MAX_ATTEMPTS = 6

          def get_token(cid, csec, rtok):
              body = urllib.parse.urlencode({
                  "client_id": cid, "client_secret": csec,
                  "refresh_token": rtok, "grant_type": "refresh_token"}).encode()
              return json.load(urllib.request.urlopen("https://oauth2.googleapis.com/token", body, timeout=60))["access_token"]

          DT = get_token(DCID, DCSEC, DRTOK)
          YT = get_token(YCID, YCSEC, YRTOK)

          def drive_get(url):
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + DT})
              return json.load(urllib.request.urlopen(req, timeout=60))

          def yt_get(url):
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + YT})
              return json.load(urllib.request.urlopen(req, timeout=60))

          def yt_put(url, obj):
              body = json.dumps(obj).encode()
              req = urllib.request.Request(url, data=body, headers={
                  "Authorization": "Bearer " + YT, "Content-Type": "application/json; charset=UTF-8"}, method="PUT")
              return json.load(urllib.request.urlopen(req, timeout=60))

          def list_children(fid):
              out, pt = [], None
              while True:
                  u = ("https://www.googleapis.com/drive/v3/files?q="
                       + urllib.parse.quote("'%s' in parents and trashed=false" % fid)
                       + "&fields=files(id,name),nextPageToken&pageSize=1000")
                  if pt:
                      u += "&pageToken=" + pt
                  r = drive_get(u)
                  out += r.get("files", [])
                  pt = r.get("nextPageToken")
                  if not pt:
                      return out

          q = "name='%s' and mimeType='application/vnd.google-apps.folder' and trashed=false" % ROOT_FOLDER_NAME
          r = drive_get("https://www.googleapis.com/drive/v3/files?q=" + urllib.parse.quote(q) + "&fields=files(id,name)")
          if not r.get("files"):
              print("no drive folder yet")
              raise SystemExit(0)
          root_id = r["files"][0]["id"]
          root_children = list_children(root_id)
          q2 = "'%s' in parents and trashed=false and name='%s'" % (root_id, MANIFEST_NAME)
          mf = drive_get("https://www.googleapis.com/drive/v3/files?q=" + urllib.parse.quote(q2) + "&fields=files(id,name)")
          if not mf.get("files"):
              print("no manifest yet")
              raise SystemExit(0)
          manifest_id = mf["files"][0]["id"]
          req = urllib.request.Request(
              "https://www.googleapis.com/drive/v3/files/%s?alt=media" % manifest_id,
              headers={"Authorization": "Bearer " + DT})
          manifest = json.load(urllib.request.urlopen(req, timeout=60))

          def save_manifest():
              body = json.dumps(manifest, ensure_ascii=False).encode()
              req = urllib.request.Request(
                  "https://www.googleapis.com/upload/drive/v3/files/%s?uploadType=media" % manifest_id,
                  data=body, method="PATCH",
                  headers={"Authorization": "Bearer " + DT, "Content-Type": "application/json; charset=UTF-8"})
              urllib.request.urlopen(req, timeout=60)

          # Caption text is NOT fetched from here (08/09/2026, after 3 failed attempts):
          # yt-dlp is bot-blocked from Actions IPs ("Sign in to confirm you're not a bot"),
          # captions.list (official API) is 403 for non-CMS accounts even as the owner, and
          # scraping the watch page's captionTracks baseUrl gets valid-looking metadata but
          # an EMPTY body when actually fetched (YouTube seems to require a real innertube
          # session negotiation that a simple GET doesn't satisfy). What DOES work: a small
          # local script (`fetch_captions_local.py`, runs nightly on Yosef's own machine
          # where NetFree allows www.youtube.com and yt-dlp isn't bot-blocked) fetches the
          # real transcript and uploads it as a plain .txt file to Drive's "_תמלולים" folder.
          # This job just reads whatever's there - Drive/YouTube-API/Gemini all work fine
          # from Actions, only the caption fetch itself needed a residential IP.
          TRANSCRIPTS_FOLDER_NAME = "_תמלולים"
          _transcripts_folder = next((f for f in root_children if f["name"] == TRANSCRIPTS_FOLDER_NAME), None)
          _transcripts_by_video = {}
          if _transcripts_folder:
              for f in list_children(_transcripts_folder["id"]):
                  if f["name"].endswith(".json"):
                      _transcripts_by_video[f["name"][:-5]] = f["id"]

          def fetch_captions_text(video_id):
              file_id = _transcripts_by_video.get(video_id)
              if not file_id:
                  return None
              req = urllib.request.Request(
                  "https://www.googleapis.com/drive/v3/files/%s?alt=media" % file_id,
                  headers={"Authorization": "Bearer " + DT})
              obj = json.load(urllib.request.urlopen(req, timeout=30))
              title, description = obj.get("title"), obj.get("description")
              return (title, description) if title and description else None

          checked, refined, failed = 0, 0, 0
          for fid, info in manifest.items():
              vid = info.get("video_id")
              if not vid or info.get("refine_status") == "done":
                  continue
              attempts = info.get("refine_attempts", 0)
              if attempts >= MAX_ATTEMPTS:
                  continue
              checked += 1
              info["refine_attempts"] = attempts + 1
              try:
                  result = fetch_captions_text(vid)
                  if not result:
                      print("  [%s] not refined yet (attempt %d/%d)" % (vid, attempts + 1, MAX_ATTEMPTS), flush=True)
                      continue
                  title, description = result
                  cur = yt_get("https://www.googleapis.com/youtube/v3/videos?part=snippet&id=%s" % vid)
                  items = cur.get("items", [])
                  if not items:
                      info["refine_status"] = "done"
                      continue
                  snippet = items[0]["snippet"]
                  snippet["title"] = title[:100]
                  full_description = description + "\n\nהרב אבשלום שניידר - מכון להב מפיו יצא\nמקור: קול הלשון\n\nהועלה אוטומטית."
                  # שיעורי "ספר דעת תבונות" - שמור את מיקום האות/סימן שנקבע בשעת ההעלאה גם
                  # אחרי שהתיאור נדרס מהתמלול (יוסף ביקש שזה לא ילך לאיבוד).
                  dt_citation = info.get("dt_citation")
                  if dt_citation:
                      full_description = "📖 מיקום בספר: %s\n\n%s" % (dt_citation, full_description)
                  snippet["description"] = full_description
                  yt_put("https://www.googleapis.com/youtube/v3/videos?part=snippet", {"id": vid, "snippet": snippet})
                  info["refine_status"] = "done"
                  info["title"] = title
                  refined += 1
                  print("  [%s] refined from real transcript -> %s" % (vid, title), flush=True)
              except Exception as e:
                  print("  [%s] FAILED:" % vid, e, flush=True)
                  failed += 1
              save_manifest()

          print("refine_metadata done: checked=%d refined=%d failed=%d" % (checked, refined, failed), flush=True)
          PY

